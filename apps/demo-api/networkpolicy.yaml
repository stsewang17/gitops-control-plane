# Deny all ingress in the namespace, then allow only the traffic the lab needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: demo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-api-ingress
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app: demo-api
  policyTypes: [Ingress]
  ingress:
    # App traffic from the load generator only
    - from:
        - podSelector:
            matchLabels:
              app: demo-load-generator
      ports:
        - port: 9898
          protocol: TCP
    # Metrics scrapes from Prometheus only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9797
          protocol: TCP
