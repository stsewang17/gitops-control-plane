apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: demo-api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: demo-api
  # Copy these pod labels onto every series; becomes app and rollouts_pod_template_hash in PromQL.
  podTargetLabels:
    - app
    - rollouts-pod-template-hash
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
