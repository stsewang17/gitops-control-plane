# Argo CD manages its own Helm release after bootstrap.
# No finalizer and prune off, so deleting this Application or a bad commit cannot remove Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.15.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/values/argo-cd.yaml
    - repoURL: https://github.com/stsewang17/gitops-control-plane.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
