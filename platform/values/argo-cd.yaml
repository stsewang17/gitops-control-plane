# Argo CD Helm values. Used once by the helm install in Step 2, then by the self-managed argo-cd Application.
global:
  domain: argocd.localhost

configs:
  cm:
    # Track resources by annotation so Argo CD and Crossplane do not fight over labels.
    application.resourceTrackingMethod: annotation
    timeout.reconciliation: 60s

    # Health checks. More entries are added here in Lab 2 as Crossplane arrives.
    resource.customizations: |
      # Child Applications report real health, so app-of-apps sync waves wait for them.
      argoproj.io/Application:
        health.lua: |
          hs = {status = "Progressing", message = ""}
          if obj.status ~= nil and obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
          return hs
      # Crossplane packages, XRDs, compositions and managed resources.
      "*.crossplane.io/*":
        health.lua: |
          hs = {status = "Progressing", message = "Waiting for Crossplane"}
          local noStatus = {Composition = true, CompositionRevision = true, DeploymentRuntimeConfig = true,
                            ProviderConfig = true, ProviderConfigUsage = true, EnvironmentConfig = true}
          if obj.status == nil or obj.status.conditions == nil then
            if noStatus[obj.kind] then
              hs.status = "Healthy"
              hs.message = "No status to assess"
            end
            return hs
          end
          local c = {}
          for _, cond in ipairs(obj.status.conditions) do c[cond.type] = cond end
          if c.Synced ~= nil and c.Synced.status == "False" then
            return {status = "Degraded", message = c.Synced.message or "Sync failed"}
          end
          if c.LastAsyncOperation ~= nil and c.LastAsyncOperation.status == "False" then
            return {status = "Degraded", message = c.LastAsyncOperation.message or "Async operation failed"}
          end
          if c.Installed ~= nil then
            if c.Installed.status == "True" and c.Healthy ~= nil and c.Healthy.status == "True" then
              return {status = "Healthy", message = "Package installed and healthy"}
            end
            return hs
          end
          if c.Established ~= nil then
            if c.Established.status == "True" then
              return {status = "Healthy", message = "XRD established"}
            end
            return hs
          end
          if c.Ready ~= nil and c.Ready.status == "True" then
            return {status = "Healthy", message = "Resource is ready"}
          end
          return hs
      
      # Developer claims: Healthy only once Crossplane marks them Ready.
      finplatform.io/*:
        health.lua: |
          hs = {status = "Progressing", message = "Waiting for Crossplane to reconcile the claim"}
          if obj.status ~= nil and obj.status.conditions ~= nil then
            local c = {}
            for _, cond in ipairs(obj.status.conditions) do c[cond.type] = cond end
            if c.Synced ~= nil and c.Synced.status == "False" then
              hs.status = "Degraded"
              hs.message = c.Synced.message or "Claim failed to sync"
            elseif c.Ready ~= nil and c.Ready.status == "True" then
              hs.status = "Healthy"
              hs.message = "Claim is ready"
            end
          end
          return hs 
# SSO is out of scope for the lab; production enables Dex or OIDC here.
dex:
  enabled: false

controller:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
